plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'github.com.CraftKernel'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = 'publicskintotems-api'
            from components.java
        }
    }
}
