plugins {
    id 'maven-publish'
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

def mcVersion = findProperty('mcVersion') ?: project.minecraft_version
def mcLabel = findProperty('mcLabel') ?: mcVersion
def versionProps = new Properties()
file("versions/${mcVersion}.properties").with { if (it.exists()) it.withInputStream { versionProps.load(it) } }
versionProps.each { k, v -> project.ext.set(k, v) }

version = project.mod_version
group = 'github.com.CraftKernel'
base.archivesName = "publicskintotems-forge-mc${mcLabel}"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def dataCompat = project.hasProperty('data') ? project.data : 'v1_21_9'
sourceSets.main.java.srcDir "../common/modern/data/${dataCompat}/java"
sourceSets.main.java.srcDir "../common/modern/server/java"
if (!project.hasProperty('legacy_render')) {
    sourceSets.main.java.srcDir "../common/modern/itemstate/java"
}
sourceSets.main.resources.srcDir "../common/modern/compat/${project.compat}/resources"
sourceSets.main.java.srcDir "../common/modern/compat/${project.compat}/java"

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            args "--mixin.config=publicskintotems.mixins.json"
            if (findProperty('quickWorld')) {
                args '--quickPlaySingleplayer', findProperty('quickWorld')
            }
        }
        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    compileOnly 'org.spongepowered:mixin:0.8.7'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_range", project.mc_range
    inputs.property "forge_major", project.forge_major
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version, "mc_range": project.mc_range, "forge_major": project.forge_major
    }
}

tasks.named('jar', Jar) {
    from("LICENSE.txt")
    manifest {
        attributes['MixinConfigs'] = "publicskintotems.mixins.json"
    }
}

tasks.register('copyToLibs', Copy) {
    from(tasks.named('jar'))
    into rootProject.file('../../build/libs')
}
tasks.named('build') { finalizedBy 'copyToLibs' }

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            groupId = 'github.com.CraftKernel'
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
