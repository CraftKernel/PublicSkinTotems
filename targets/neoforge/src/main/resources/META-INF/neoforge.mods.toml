modLoader="javafml"
loaderVersion="[1,)"
license="Apache-2.0"

[[mods]]
modId="publicskintotems"
version="${version}"
displayName="PublicSkinTotems"
authors="Endyboii"
logoFile="assets/publicskintotems/icon.png"
description='''Renders claimed Totems of Undying as 3D figures wearing the owner's skin. Pick up a plain totem and it locks to your skin automatically; totems claimed by other players keep their skin, so everyone can see whose totem is whose.'''

[[mixins]]
config="publicskintotems.mixins.json"

[[dependencies.publicskintotems]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_major},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.publicskintotems]]
    modId="minecraft"
    type="required"
    versionRange="${mc_range}"
    ordering="NONE"
    side="BOTH"
